name: CI

# Verification pipeline for non-main branches and pull requests. Runs
# the same checks as the deploy workflow's build job (typecheck, lint,
# format, build) WITHOUT publishing to GitHub Pages. The deploy
# workflow re-runs all of these on the merge commit to main, so any
# regression introduced by a merge still gates the deploy.
#
# Skipped intentionally on main: the deploy workflow's build job is
# the source of truth for main and runs the identical script set.
# Running both on a push to main would double the CI minutes for zero
# additional signal.
on:
  pull_request:
    branches: [main]
  push:
    branches-ignore: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify (typecheck, lint, format, build)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies (clean, reproducible)
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Build (without deploy)
        run: npm run build
